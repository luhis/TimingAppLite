<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Cartoon classic mini-style car in a grass autotest</title>
  <desc id="desc">A red cartoon compact rally car weaving between cones on a grassy autotest field.</desc>

  <defs>
