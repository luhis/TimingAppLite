name: DotNetBackend CI

on:
  push:
    branches: ['**']
    paths:
      - 'DotNetBackend/**'
      - '.github/workflows/dotnetbackend-ci.yml'
  pull_request:
    branches: ['**']
    paths:
      - 'DotNetBackend/**'
      - '.github/workflows/dotnetbackend-ci.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('DotNetBackend/**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore dependencies
        run: dotnet restore DotNetBackend/DotNetBackend.slnx

      - name: Build (includes code style enforcement)
        run: dotnet build DotNetBackend/DotNetBackend.slnx --no-restore --configuration Release

      - name: Test
        run: dotnet test DotNetBackend/DotNetBackend.slnx --no-build --configuration Release --verbosity normal
