name: DotNetBackend CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore DotNetBackend/DotNetBackend.slnx

      - name: Build (includes code style enforcement)
        run: dotnet build DotNetBackend/DotNetBackend.slnx --no-restore --configuration Release

      - name: Test
        run: dotnet test DotNetBackend/DotNetBackend.slnx --no-build --configuration Release --verbosity normal
