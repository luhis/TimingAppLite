name: Trigger auto deployment for timingapplite

# When this action will be executed
on:
  # Automatically trigger it when detected changes in repo
  push:
    branches: 
      [ master ]
    paths:
    - 'DotNetBackend/**'
    - '.github/workflows/timingapplite-AutoDeployTrigger-40268da8-4efa-4907-827a-1b54e0fa9baa.yml'

  # Allow manual trigger 
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false      

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions: 
      id-token: write #This is required for requesting the OIDC JWT Token
      contents: read #Required when GH token is used to authenticate with private repo
      packages: write #Required to push to GitHub Container Registry

    steps:
      - name: Checkout to the branch
        uses: actions/checkout@v6

      - name: Azure Login
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.TIMINGAPPLITE_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.TIMINGAPPLITE_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.TIMINGAPPLITE_AZURE_SUBSCRIPTION_ID }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.PAT_TOKEN }}

      - name: Build and push image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ${{ github.workspace }}/DotNetBackend
          file: ${{ github.workspace }}/DotNetBackend/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/timingapplite:${{ github.sha }}

      - name: Ensure GHCR pull credentials on Container App
        run: |
          az containerapp registry set \
            --name timingapplite \
            --resource-group AutoTest \
            --server ghcr.io \
            --username ${{ github.actor }} \
            --password ${{ secrets.PAT_TOKEN }}

      - name: Deploy Container App using immutable digest
        run: |
          az containerapp update \
            --name timingapplite \
            --resource-group AutoTest \
            --target-port 8080 \
            --image ghcr.io/${{ github.repository_owner }}/timingapplite@${{ steps.build.outputs.digest }}


