name: Backend CI

on:
  push:
    branches: ['**']
    paths:
      - 'DotNetBackend/**'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    branches: ['**']
    paths:
      - 'DotNetBackend/**'
      - '.github/workflows/backend-ci.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      DOTNET_NOLOGO: 1

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('DotNetBackend/**/*.csproj', 'DotNetBackend/Directory.Build.props') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore
        run: dotnet restore DotNetBackend/DotNetBackend.slnx

      - name: Build
        run: dotnet build DotNetBackend/DotNetBackend.slnx --no-restore -c Release

      - name: Test
        run: dotnet run --project DotNetBackend/DotNetBackend.slnx --no-build -c Release
