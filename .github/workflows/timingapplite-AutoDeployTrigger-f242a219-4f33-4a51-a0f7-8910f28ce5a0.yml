name: Trigger auto deployment for timingapplite

# When this action will be executed
on:
  # Automatically trigger it when detected changes in repo
  push:
    branches: 
      [ master ]
    paths:
    - '**'
    - '.github/workflows/timingapplite-AutoDeployTrigger-f242a219-4f33-4a51-a0f7-8910f28ce5a0.yml'

  # Allow manual trigger 
  workflow_dispatch:      

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions: 
      id-token: write #This is required for requesting the OIDC JWT Token
      contents: read #Required when GH token is used to authenticate with private repo

    steps:
      - name: Checkout to the branch
        uses: actions/checkout@v6

      - name: Azure Login
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.TIMINGAPPLITE_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.TIMINGAPPLITE_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.TIMINGAPPLITE_AZURE_SUBSCRIPTION_ID }}

      - name: Build and push container image to registry
        uses: azure/container-apps-deploy-action@v2
        with:
          appSourcePath: ${{ github.workspace }}/DotNetBackend
          dockerfilePath: Dockerfile
          registryUrl: ${{ secrets.TIMINGAPPLITE_REGISTRY_URL }}
          registryUsername: ${{ secrets.TIMINGAPPLITE_REGISTRY_USERNAME }}
          registryPassword: ${{ secrets.TIMINGAPPLITE_REGISTRY_PASSWORD }}
          containerAppName: timingapplite
          resourceGroup: TimingAppLite_group
          imageToBuild: ${{ secrets.TIMINGAPPLITE_REGISTRY_URL }}/timingapplite:${{ github.sha }}


