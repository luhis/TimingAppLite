name: Backend Deploy

on:
  push:
    branches: 
      [ master ]
    paths:
    - 'DotNetBackend/**'
    - '.github/workflows/backend-deploy.yml'

  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false      

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions: 
      id-token: write
      contents: read
      packages: write

    steps:
      - name: Checkout to the branch
        uses: actions/checkout@v7

      - name: Azure Login
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.TIMINGAPPLITE_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.TIMINGAPPLITE_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.TIMINGAPPLITE_AZURE_SUBSCRIPTION_ID }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.PAT_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: ${{ github.workspace }}/DotNetBackend
          file: ${{ github.workspace }}/DotNetBackend/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/timingapplite:${{ github.sha }}
          cache-from: type=gha,scope=timingapplite
          cache-to: type=gha,mode=max,scope=timingapplite

      - name: Deploy to Container App
        uses: azure/container-apps-deploy-action@v2
        with:
          imageToDeploy: ghcr.io/${{ github.repository_owner }}/timingapplite:${{ github.sha }}
          containerAppName: timingapplite
          resourceGroup: AutoTest
